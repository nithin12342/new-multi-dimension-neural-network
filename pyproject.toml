[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-nfm-net"
version = "2.1.0"
authors = [
  { name="MultimodalNFMNet Team" },
]
description = "High-Dimensional Multimodal Neural Field Model with Chebyshev Contractions, Poincaré Hyperbolic Geometry, and Native Rust Runtime"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "safetensors>=0.4.0",
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "psutil>=5.9.0",
    "transformers>=4.30.0",
]

[project.scripts]
nfm-train = "train:main"
nfm-pretrain = "pretrain:main"
