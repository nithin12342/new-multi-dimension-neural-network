[package]
name = "nfm-core"
version = "0.1.0"
edition = "2021"
authors = ["MultimodalNFMNet Team"]
description = "Native zero-overhead Rust runtime layer for MultimodalNFMNet: Chebyshev contractions, Poincaré gyro-projections, clamped losses, and Arrow telemetry"

[dependencies]
arrow = { version = "53", default-features = false }
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }
safetensors = "0.4"

[dev-dependencies]
tempfile = "3"
